[package]
name = "taskbar_media_viewer"
version = "1.0.1"
edition = "2024"

[dependencies]
# Only the OpenGL renderer and fonts; the defaults add an accessibility tree rebuilt every frame and Linux backends.
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts"] }
futures-util = "0.3"
nowhear = "0.2.0"
pollster = "0.4.0"
tokio = { version = "1", features = ["rt", "time"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Media_Control",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Ole",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
]}
windows-future = "0.3"
winreg = "0.55.0"
self_update = { version = "0.40", features = ["archive-tar", "archive-zip", "compression-flate2", "rustls"], default-features = false }
zip = { version = "0.6", features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
